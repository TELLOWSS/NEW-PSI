name: PSI inspector mobile browser QA

on:
  pull_request:
    paths:
      - 'components/inspector/**'
      - 'pages/InspectorReply.tsx'
      - 'lib/inspector/**'
      - 'scripts/verify-inspector-camera.mjs'
      - 'scripts/verify-inspector-action-share.mjs'
      - 'scripts/verify-inspector-result-journey.mjs'
      - 'scripts/verify-inspector-queue.mjs'
      - 'scripts/verify-inspector-friendly-recovery.mjs'
      - '.github/workflows/inspector-mobile-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspector-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspector-mobile:
    name: synthetic-camera-and-sharing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      PSI_SHARE_DIST: dist
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build once for field-browser QA
        run: npm run build
      - name: Camera permission, rotation, fallback and narrow viewports
        run: node scripts/verify-inspector-camera.mjs
      - name: Sharing, reply, denied/revoked links and handoff
        run: node scripts/verify-inspector-action-share.mjs
      - name: First-use photo to expert review and printable report
        run: PSI_QA_BUILT=1 node scripts/verify-inspector-result-journey.mjs
      - name: Sixteen-photo triage, search, export and unsaved drafts
        run: PSI_QUEUE_DIST=dist node scripts/verify-inspector-queue.mjs
      - name: Analysis blocked, denied, timed out and manual recovery
        run: PSI_QA_BUILT=1 node scripts/verify-inspector-friendly-recovery.mjs
      - name: Official source review states and admin candidate controls
        run: node scripts/verify-inspector-sources.mjs
      - name: Capture, manual inspection, draft protection and saved-record resume
        run: node scripts/verify-inspector-mobile-ux.mjs
      - name: Upload synthetic-only QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-mobile-qa-evidence
          path: |
            artifacts/audit/inspector-mobile-ux/
            artifacts/audit/inspector-sources/
            artifacts/audit/inspector-camera/
            artifacts/audit/action-share/
            artifacts/audit/inspector-result-journey-built/
            artifacts/audit/inspector-queue/
            artifacts/audit/inspector-friendly-recovery-built/
          if-no-files-found: ignore
          retention-days: 7
