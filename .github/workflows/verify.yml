name: PSI release verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: release-verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:ci
      - name: Offline F10 state-matrix and privacy simulation (no Vercel)
        run: node scripts/verify-field-camera-batch33.mjs
      - name: Preserve source-only integration review manifest (never a deploy approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi-field-camera-integration-source-manifest
          path: artifacts/audit/field-camera/32-integration-source-manifest.json
          if-no-files-found: ignore
          retention-days: 7
